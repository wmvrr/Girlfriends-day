<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stabilized!</title>

<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{

    width:100%;
    height:100%;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#c8a97e;

    font-family:'Cormorant Garamond',serif;

    overflow:hidden;

}

/* Parchment texture */

body::before{

    content:"";

    position:fixed;

    inset:0;

    background:

    radial-gradient(circle at 20% 20%,rgba(90,60,30,.08),transparent 35%),

    radial-gradient(circle at 80% 70%,rgba(90,60,30,.08),transparent 35%),

    repeating-linear-gradient(
        45deg,
        rgba(255,255,255,.02),
        rgba(255,255,255,.02) 2px,
        transparent 2px,
        transparent 6px
    );

    pointer-events:none;

}

/* Container */

.container{

    display:flex;

    flex-direction:column;

    align-items:center;

    position:relative;

    z-index:2;

}

/* Message Box */

.alert-box{

    background:#f3e2b8;

    color:#4a2b18;

    padding:40px;

    width:560px;

    max-width:90%;

    border:2px solid #8b5a2b;

    border-radius:12px;

    text-align:center;

    font-family:'UnifrakturCook',cursive;

    font-size:34px;

    box-shadow:
        inset 0 0 30px rgba(0,0,0,.12),
        0 12px 30px rgba(0,0,0,.28);

    opacity:0;

    transition:opacity 1s ease;

}

/* Button */

.yay-btn{

    margin-top:35px;

    background:#4b2e16;

    color:#f3e2b8;

    padding:15px 45px;

    border:none;

    border-radius:8px;

    cursor:pointer;

    font-family:'Cormorant Garamond',serif;

    font-size:24px;

    box-shadow:0 8px 18px rgba(0,0,0,.35);

    transition:.3s;

    opacity:0;

}

.yay-btn:hover{

    background:#654321;

    transform:translateY(-3px);

}

/* Floating Hearts */

.heart{

    position:absolute;

    pointer-events:none;

    animation:floatUp linear forwards;

}

@keyframes floatUp{

    0%{

        transform:translateY(0) rotate(0deg);

        opacity:.9;

    }

    100%{

        transform:translateY(-120vh) rotate(360deg);

        opacity:0;

    }

}

/* Confetti Canvas */

canvas{

    position:absolute;

    inset:0;

    pointer-events:none;

    z-index:9999;

}

</style>
</head>

<body>

<div class="container">

    <div class="alert-box" id="alertBox">

        Praise be! This humble heart hath escaped rejection.

    </div>

    <button class="yay-btn" id="yayBtn">

        Huzzah!

    </button>

</div>

<canvas id="confetti"></canvas>

<script>

const alertBox=document.getElementById("alertBox");
const yayBtn=document.getElementById("yayBtn");

/* Show content */

setTimeout(()=>{

    alertBox.style.opacity=1;

    yayBtn.style.opacity=1;

    generateHearts(35);

},500);

/* Button */

yayBtn.addEventListener("click",()=>{

    launchConfetti();

    setTimeout(()=>{

        window.location.href="diagnosis.html";

    },2000);

});

/* Hearts */

function generateHearts(count){

    for(let i=0;i<count;i++){

        const heart=document.createElement("div");

        heart.className="heart";

        heart.innerHTML=Math.random()>0.5?"❤️":"💖";

        heart.style.left=Math.random()*window.innerWidth+"px";

        heart.style.bottom="-40px";

        heart.style.fontSize=(14+Math.random()*26)+"px";

        heart.style.animationDuration=(4+Math.random()*3)+"s";

        heart.style.animationDelay=Math.random()*2+"s";

        document.body.appendChild(heart);

        heart.addEventListener("animationend",()=>{

            heart.remove();

            generateHearts(1);

        });

    }

}

/* Confetti */

function launchConfetti(){

    const canvas=document.getElementById("confetti");

    const ctx=canvas.getContext("2d");

    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;

    const pieces=[];

    for(let i=0;i<180;i++){

        pieces.push({

            x:Math.random()*canvas.width,

            y:Math.random()*canvas.height-canvas.height,

            r:Math.random()*6+4,

            d:Math.random()*180,

            color:`hsl(${Math.random()*360},100%,50%)`,

            tilt:Math.random()*10-10,

            tiltAngle:0,

            tiltSpeed:Math.random()*0.07+0.05

        });

    }

    function draw(){

        ctx.clearRect(0,0,canvas.width,canvas.height);

        pieces.forEach(p=>{

            ctx.beginPath();

            ctx.lineWidth=p.r;

            ctx.strokeStyle=p.color;

            ctx.moveTo(p.x+p.tilt,p.y);

            ctx.lineTo(p.x,p.y+p.tilt);

            ctx.stroke();

        });

        update();

    }

    function update(){

        pieces.forEach(p=>{

            p.tiltAngle+=p.tiltSpeed;

            p.y+=(Math.cos(p.d)+3+p.r)/2;

            p.x+=Math.sin(p.d);

            p.tilt=Math.sin(p.tiltAngle)*15;

            if(p.y>canvas.height){

                p.y=-20;

                p.x=Math.random()*canvas.width;

            }

        });

    }

    const animation=setInterval(draw,20);

    setTimeout(()=>{

        clearInterval(animation);

        ctx.clearRect(0,0,canvas.width,canvas.height);

    },2000);

}

</script>

</body>
</html>
