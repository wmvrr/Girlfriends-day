<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Final Question</title>

<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#c8a97e;

    font-family:'Cormorant Garamond',serif;

    overflow:hidden;

}

/* Paper texture */

body::before{

    content:"";

    position:fixed;

    inset:0;

    background:
    radial-gradient(circle at 20% 20%,rgba(90,60,30,.08),transparent 35%),
    radial-gradient(circle at 80% 70%,rgba(90,60,30,.08),transparent 35%),
    repeating-linear-gradient(
        45deg,
        rgba(255,255,255,.02),
        rgba(255,255,255,.02) 2px,
        transparent 2px,
        transparent 6px
    );

    pointer-events:none;

}

.container{

    display:flex;
    flex-direction:column;
    align-items:center;
    z-index:2;

}

/* Parchment */

.parchment{

    width:600px;
    max-width:90%;

    background:#f3e2b8;

    border:2px solid #8b5a2b;

    border-radius:12px;

    padding:45px;

    color:#4a2b18;

    text-align:center;

    box-shadow:
        inset 0 0 30px rgba(0,0,0,.12),
        0 12px 30px rgba(0,0,0,.28);

}

.parchment h1{

    font-family:'UnifrakturCook',cursive;

    font-size:40px;

    margin-bottom:25px;

    color:#5a2f0d;

}

.parchment p{

    font-size:28px;

    line-height:1.7;

}

/* Buttons */

.buttons{

    margin-top:35px;

    display:flex;

    gap:20px;

}

.btn{

    padding:15px 40px;

    background:#4b2e16;

    color:#f3e2b8;

    border:none;

    border-radius:8px;

    font-size:24px;

    font-family:'Cormorant Garamond',serif;

    cursor:pointer;

    transition:.25s;

    box-shadow:0 8px 18px rgba(0,0,0,.3);

}

.btn:hover{

    background:#654321;

    transform:translateY(-3px);

}

/* Flash */

.flash{

    position:fixed;

    inset:0;

    background:rgba(120,0,0,.45);

    animation:flash .15s alternate 8;

    z-index:50;

}

@keyframes flash{

from{opacity:0;}

to{opacity:1;}

}

/* Warning */

.warning-box{

    position:fixed;

    left:50%;

    top:50%;

    transform:translate(-50%,-50%);

    background:#4b2e16;

    color:#f3e2b8;

    border:3px solid #f3e2b8;

    padding:35px 55px;

    border-radius:12px;

    font-family:'UnifrakturCook',cursive;

    font-size:46px;

    z-index:60;

}

/* Hearts */

.heart{

    position:fixed;

    font-size:30px;

    animation:floatUp 3s linear forwards;

    z-index:100;

}

@keyframes floatUp{

from{

transform:translateY(0);

opacity:1;

}

to{

transform:translateY(-110vh);

opacity:0;

}

}

/* Confetti */

.confetti{

    position:fixed;

    width:10px;

    height:10px;

    animation:fall 3s linear forwards;

    z-index:100;

}

@keyframes fall{

from{

transform:translateY(-40px);

opacity:1;

}

to{

transform:translateY(110vh);

opacity:0;

}

}

</style>
</head>

<body>

<div class="container">

<div class="parchment">

<h1>The Final Petition</h1>

<p>

Wilt Thou remain beside thy devoted admirer
for all the days that Fate shall grant us?

</p>

</div>

<div class="buttons">

<button id="yesBtn" class="btn">
YES
</button>

<button id="noBtn" class="btn">
NO
</button>

</div>

</div>

<script>

const yesBtn=document.getElementById("yesBtn");
const noBtn=document.getElementById("noBtn");

noBtn.addEventListener("click",()=>{

const flash=document.createElement("div");

flash.className="flash";

document.body.appendChild(flash);

const warning=document.createElement("div");

warning.className="warning-box";

warning.innerText="THAT IS NO CHOICE.";

document.body.appendChild(warning);

setTimeout(()=>{

flash.remove();

warning.remove();

},1200);

});

yesBtn.addEventListener("click",()=>{

hearts();

confetti();

setTimeout(()=>{

window.location.href="mwah.html";

},3000);

});

function hearts(){

for(let i=0;i<45;i++){

setTimeout(()=>{

const h=document.createElement("div");

h.className="heart";

h.innerHTML="❤️";

h.style.left=Math.random()*100+"vw";

h.style.bottom="-30px";

document.body.appendChild(h);

setTimeout(()=>h.remove(),3000);

},i*70);

}

}

function confetti(){

const colors=["#b22222","#daa520","#f3e2b8","#8b5a2b","#ffffff"];

for(let i=0;i<70;i++){

setTimeout(()=>{

const c=document.createElement("div");

c.className="confetti";

c.style.left=Math.random()*100+"vw";

c.style.background=colors[Math.floor(Math.random()*colors.length)];

document.body.appendChild(c);

setTimeout(()=>c.remove(),3000);

},i*40);

}

}

</script>

</body>
</html>
