<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Letter</title>

<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    height:100vh;

    background:#c8a97e;

    font-family:'Cormorant Garamond',serif;

    overflow:hidden;

}

/* Paper texture */

body::before{

    content:"";

    position:fixed;

    inset:0;

    background:

    radial-gradient(circle at 20% 20%,rgba(90,60,30,.08),transparent 35%),

    radial-gradient(circle at 80% 70%,rgba(90,60,30,.08),transparent 35%),

    repeating-linear-gradient(
        45deg,
        rgba(255,255,255,.02),
        rgba(255,255,255,.02) 2px,
        transparent 2px,
        transparent 6px
    );

    pointer-events:none;

}

/* Letter */

.box{

    position:relative;
    z-index:2;

    width:500px;
    max-width:90%;

    background:#f3e2b8;

    color:#4a2b18;

    padding:40px;

    border:2px solid #8b5a2b;

    border-radius:12px;

    text-align:center;

    box-shadow:
        inset 0 0 30px rgba(0,0,0,.12),
        0 10px 30px rgba(0,0,0,.25);

}

.box h2{

    font-family:'UnifrakturCook',cursive;

    font-size:42px;

    color:#5a2f0d;

    margin-bottom:25px;

}

.box p{

    font-size:23px;

    line-height:1.8;

    text-align:justify;

}

/* Scroll */

.scroll-link{

    margin-top:35px;

    text-decoration:none;

    z-index:2;

}

.rolled-scroll{

    position:relative;

    width:220px;

    height:70px;

    display:flex;

    justify-content:center;

    align-items:center;

    transition:.3s;

}

.rolled-scroll:hover{

    transform:scale(1.05);

}

.paper{

    width:150px;

    height:45px;

    background:#f5e7bf;

    border-top:2px solid #caa66d;

    border-bottom:2px solid #caa66d;

    box-shadow:
        inset 0 0 10px rgba(0,0,0,.12);

}

.roll-left,
.roll-right{

    width:35px;

    height:50px;

    background:linear-gradient(
        to right,
        #8b5a2b,
        #d2a679,
        #8b5a2b
    );

    border-radius:50%;

    box-shadow:
        inset 0 0 8px rgba(255,255,255,.4),
        inset 0 0 10px rgba(0,0,0,.35);

}

.roll-left{

    margin-right:-8px;

}

.roll-right{

    margin-left:-8px;

}

/* Ribbon */

.ribbon{

    position:absolute;

    background:#6b3b1f;

    color:#f3e2b8;

    padding:10px 28px;

    border-radius:4px;

    font-family:'Cormorant Garamond',serif;

    font-weight:bold;

    letter-spacing:1px;

    box-shadow:0 4px 12px rgba(0,0,0,.35);

}

.ribbon::before{

    content:"";

    position:absolute;

    left:-12px;
    top:0;

    border-top:18px solid transparent;
    border-bottom:18px solid transparent;
    border-right:12px solid #4b2e16;

}

.ribbon::after{

    content:"";

    position:absolute;

    right:-12px;
    top:0;

    border-top:18px solid transparent;
    border-bottom:18px solid transparent;
    border-left:12px solid #4b2e16;

}

</style>
</head>

<body>

<div class="box">

    <h2>Most Gracious Lady</h2>

    <p>

        I deem myself far too humble to address Your Grace with my own voice.
        Therefore, I entrust these thoughts to parchment, praying that this
        modest letter may speak where I dare not.

    </p>

</div>

<a href="critical.html" class="scroll-link">

    <div class="rolled-scroll">

        <div class="roll-left"></div>

        <div class="paper"></div>

        <div class="roll-right"></div>

        <div class="ribbon">

            Continue.

        </div>

    </div>

</a>

</body>
</html>
