<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Symptoms</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .box {
            background-color: pink;
            color: black;
            width: 380px;
            padding: 22px;
            border-radius: 14px;
            text-align: left;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            font-size: 18px;
        }

        .box h2 {
            text-align: center;
            margin-bottom: 15px;
        }

        .box ul {
            padding-left: 20px;
        }

        /* ✅ Line spacing added here */
        .box ul li {
            line-height: 1.8;
            margin-bottom: 10px;
        }

        .continue-btn {
            margin-top: 18px;
            background-color: red;
            color: black;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
        }

    .scroll-link{

    margin-top:35px;

    text-decoration:none;

}

.rolled-scroll{

    position:relative;

    width:220px;

    height:70px;

    display:flex;

    justify-content:center;

    align-items:center;

    transition:.3s;

}

.rolled-scroll:hover{

    transform:scale(1.05);

}

.paper{

    width:150px;

    height:45px;

    background:#f5e7bf;

    border-top:2px solid #caa66d;
    border-bottom:2px solid #caa66d;

    box-shadow:
        inset 0 0 10px rgba(0,0,0,.12);

}

.roll-left,
.roll-right{

    width:35px;
    height:50px;

    background:
    linear-gradient(
    to right,
    #8b5a2b,
    #d2a679,
    #8b5a2b
    );

    border-radius:50%;

    box-shadow:
    inset 0 0 8px rgba(255,255,255,.4),
    inset 0 0 10px rgba(0,0,0,.35);

}

.roll-left{

    margin-right:-8px;

}

.roll-right{

    margin-left:-8px;

}

.ribbon{

    position:absolute;

    background:#a40028;

    color:white;

    padding:10px 28px;

    border-radius:4px;

    font-weight:bold;

    box-shadow:0 4px 12px rgba(0,0,0,.35);

}

.ribbon::before{

    content:"";

    position:absolute;

    left:-12px;
    top:0;

    border-top:18px solid transparent;
    border-bottom:18px solid transparent;
    border-right:12px solid #7b001d;

}

.ribbon::after{

    content:"";

    position:absolute;

    right:-12px;
    top:0;

    border-top:18px solid transparent;
    border-bottom:18px solid transparent;
    border-left:12px solid #7b001d;
    .ribbon{

    position:absolute;

    display:flex;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    width:90px;

    height:75px;

    background:#8b0020;

    border-radius:6px;

    box-shadow:
        0 5px 12px rgba(0,0,0,.35),
        inset 0 0 8px rgba(255,255,255,.15);

}

.ribbon::before{

    content:"";

    position:absolute;

    left:-14px;

    border-top:37px solid transparent;
    border-bottom:37px solid transparent;
    border-right:14px solid #6d0018;

}

.ribbon::after{

    content:"";

    position:absolute;

    right:-14px;

    border-top:37px solid transparent;
    border-bottom:37px solid transparent;
    border-left:14px solid #6d0018;

}

.ribbon-link{

    text-decoration:none;

    color:#ffe7b3;

    font-family:Georgia,serif;

    font-size:12px;

    font-weight:bold;

    letter-spacing:1px;

    text-align:center;

    z-index:2;

}

.ribbon:hover{

    transform:scale(1.08);

    background:#a40028;

    transition:.3s;

}

.seal{

    position:absolute;

    bottom:-18px;

    width:34px;

    height:34px;

    border-radius:50%;

    background:radial-gradient(circle,#d91f36,#7d0018);

    border:3px solid #5f0014;

    box-shadow:0 0 12px rgba(0,0,0,.35);

}

.seal::after{

    content:"✦";

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    color:#ffd700;

    font-size:18px;

}

}
    </style>
</head>
<body>

    <div class="box">
        <h2>Symptoms</h2>
        <ul>
            <li>Complaints of chest pain around the doctor</li>
            <li>Sees the world around the doctor colourless</li>
            <li>Cannot stop smiling looking at the doctor</li>
            <li>Extreme depression getting a late reply</li>
            <li>Breathlessness when she mentions another guy’s name</li>
        </ul>
    </div>

<a href="critical.html" class="scroll-link">

    <div class="rolled-scroll">

        <div class="roll-left"></div>

        <div class="paper"></div>
        <div class="roll-right"></div>

      <div class="ribbon">

    <a href="critical.html" class="ribbon-link">
        BREAK THE SEAL
    </a>

    <div class="seal"></div>

</div>

    </div>

</a>

</body>
</html>
