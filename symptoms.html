<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Letter</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .box {
            background-color: pink;
            color: black;
            width: 380px;
            padding: 22px;
            border-radius: 14px;
            text-align: left;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            font-size: 18px;
        }

        .box h2 {
            text-align: center;
            margin-bottom: 15px;
        }

        .box ul {
            padding-left: 20px;
        }

        /* ✅ Line spacing added here */
        .box ul li {
            line-height: 1.8;
            margin-bottom: 10px;
        }

        .continue-btn {
            margin-top: 18px;
            background-color: red;
            color: black;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
        }

    .scroll-link{

    margin-top:35px;

    text-decoration:none;

}

.rolled-scroll{

    position:relative;

    width:220px;

    height:70px;

    display:flex;

    justify-content:center;

    align-items:center;

    transition:.3s;

}

.rolled-scroll:hover{

    transform:scale(1.05);

}

.paper{

    width:150px;

    height:45px;

    background:#f5e7bf;

    border-top:2px solid #caa66d;
    border-bottom:2px solid #caa66d;

    box-shadow:
        inset 0 0 10px rgba(0,0,0,.12);

}

.roll-left,
.roll-right{

    width:35px;
    height:50px;

    background:
    linear-gradient(
    to right,
    #8b5a2b,
    #d2a679,
    #8b5a2b
    );

    border-radius:50%;

    box-shadow:
    inset 0 0 8px rgba(255,255,255,.4),
    inset 0 0 10px rgba(0,0,0,.35);

}

.roll-left{

    margin-right:-8px;

}

.roll-right{

    margin-left:-8px;

}

.ribbon{

    position:absolute;

    background:#a40028;

    color:white;

    padding:10px 28px;

    border-radius:4px;

    font-weight:bold;

    box-shadow:0 4px 12px rgba(0,0,0,.35);

}

.ribbon::before{

    content:"";

    position:absolute;

    left:-12px;
    top:0;

    border-top:18px solid transparent;
    border-bottom:18px solid transparent;
    border-right:12px solid #7b001d;

}

.ribbon::after{

    content:"";

    position:absolute;

    right:-12px;
    top:0;

    border-top:18px solid transparent;
    border-bottom:18px solid transparent;
    border-left:12px solid #7b001d;
   
}
    </style>
</head>
<body>

    <div class="box">
        <h2>Most Gracious lady</h2>
        <ul>
       

I deem myself far too humble to address Your Grace with my own voice.
            Therefore, I entrust these thoughts to parchment, 
            praying that this modest letter may speak where I dare not.

        </ul>
    </div>

<a href="critical.html" class="scroll-link">

    <div class="rolled-scroll">

        <div class="roll-left"></div>

        <div class="paper"></div>
        <div class="roll-right"></div>

        <div class="ribbon">
            Continue
        </div>

    </div>

</a>

</div>

    </div>

</a>

</body>
</html>
