<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Greetings</title>

<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;

    background:#c8a97e;

    font-family:'Cormorant Garamond',serif;

    overflow:hidden;

}

/* Paper texture */

body::before{

    content:"";

    position:fixed;

    inset:0;

    background:

    radial-gradient(circle at 20% 20%,rgba(90,60,30,.08),transparent 35%),

    radial-gradient(circle at 80% 70%,rgba(90,60,30,.08),transparent 35%),

    repeating-linear-gradient(
    45deg,
    rgba(255,255,255,.02),
    rgba(255,255,255,.02) 2px,
    transparent 2px,
    transparent 6px
    );

    pointer-events:none;

}

/* Message Box */

.box{

    position:relative;

    z-index:2;

    width:420px;

    max-width:90%;

    background:#f3e2b8;

    color:#4a2b18;

    padding:35px;

    border:2px solid #8b5a2b;

    border-radius:12px;

    text-align:center;

    box-shadow:
    inset 0 0 30px rgba(0,0,0,.12),
    0 10px 30px rgba(0,0,0,.25);

}

/* Heading */

.box h2{

    font-family:'UnifrakturCook',cursive;

    font-size:42px;

    margin-bottom:18px;

    color:#5a2f0d;

}

/* Paragraph */

.box p{

    font-size:24px;

    line-height:1.6;

}

/* Button */

.approve-btn{

    position:relative;

    z-index:2;

    margin-top:30px;

    text-decoration:none;

    background:#4b2e16;

    color:#f3e2b8;

    padding:14px 36px;

    border-radius:8px;

    font-size:22px;

    font-family:'Cormorant Garamond',serif;

    transition:.3s;

    box-shadow:0 8px 18px rgba(0,0,0,.3);

}

.approve-btn:hover{

    background:#654321;

    transform:translateY(-3px);

}

</style>

</head>

<body>

<div class="box">

    <h2>Good Day, Glorious Lady</h2>

    <p>
        Your humble admirer most respectfully seeks an audience with Your Grace.
    </p>

</div>

<a href="patient.html" class="approve-btn">
    Grant Audience
</a>

</body>
</html>
