<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Greetings</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }
/* Background Texture */

body::before{

    content:"";

    position:fixed;

    inset:0;

    background:

    radial-gradient(circle at 20% 25%,rgba(90,60,30,.08),transparent 35%),

    radial-gradient(circle at 80% 75%,rgba(90,60,30,.08),transparent 35%),

    repeating-linear-gradient(
    45deg,
    rgba(255,255,255,.02),
    rgba(255,255,255,.02) 2px,
    transparent 2px,
    transparent 6px
    );

        .box {
            background-color: pink;
            color: black;
            width: 320px;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            font-size: 20px;
        }

        .approve-btn {
            margin-top: 15px;
            background-color: red;
            color: black;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 18px;
            text-decoration: none;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
        }

        .approve-btn:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>Good day Glorious Lady</h2>
        <p>Your Humble Paramour wants an audience.</p>
    </div>

    <a href="patient.html" class="approve-btn">Approve</a>

</body>
</html>
