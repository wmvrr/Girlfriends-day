<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You</title>

<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    overflow:hidden;

    background:#c8a97e;

    font-family:'Cormorant Garamond',serif;

}

/* Background Texture */

body::before{

    content:"";

    position:fixed;

    inset:0;

    background:

    radial-gradient(circle at 20% 25%,rgba(90,60,30,.08),transparent 35%),

    radial-gradient(circle at 80% 75%,rgba(90,60,30,.08),transparent 35%),

    repeating-linear-gradient(
    45deg,
    rgba(255,255,255,.02),
    rgba(255,255,255,.02) 2px,
    transparent 2px,
    transparent 6px
    );

}

/* Love Box */

.box{

    position:relative;

    z-index:5;

    width:600px;

    max-width:90%;

    padding:60px;

    text-align:center;

    background:#f3e2b8;

    border:2px solid #8b5a2b;

    border-radius:12px;

    box-shadow:
    inset 0 0 35px rgba(0,0,0,.15),
    0 15px 40px rgba(0,0,0,.3);

}

.box h1{

    font-family:'UnifrakturCook',cursive;

    font-size:72px;

    color:#5a2f0d;

    letter-spacing:3px;

}

.box p{

    margin-top:25px;

    font-size:24px;

    color:#4a2c16;

}

/* Hearts */

.heart{

    position:fixed;

    bottom:-60px;

    pointer-events:none;

    animation:floatUp linear forwards;

}

@keyframes floatUp{

    from{

        transform:translateY(0) rotate(0deg);

        opacity:0;

    }

    10%{

        opacity:1;

    }

    100%{

        transform:
        translateY(-120vh)
        translateX(var(--drift))
        rotate(360deg);

        opacity:0;

    }

}

</style>
</head>

<body>

<div class="box">

    <h1>I LOVE YOU</h1>

    <p>Happy Girlfriend's Day ❤️</p>

</div>

<script>

function createHeart(){

    const heart=document.createElement("div");

    heart.className="heart";

    heart.innerHTML=Math.random()>0.5?"❤️":"💖";

    heart.style.left=Math.random()*100+"vw";

    heart.style.fontSize=(18+Math.random()*30)+"px";

    heart.style.setProperty("--drift",(Math.random()*200-100)+"px");

    heart.style.animationDuration=(5+Math.random()*4)+"s";

    document.body.appendChild(heart);

    setTimeout(()=>{

        heart.remove();

    },9000);

}

// Create hearts continuously
setInterval(createHeart,180);

</script>

</body>
</html>
