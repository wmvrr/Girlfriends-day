<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Royal Decree</title>

<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#c8a97e;

    font-family:'Cormorant Garamond',serif;

    overflow:hidden;

}

/* Paper texture */

body::before{

    content:"";

    position:fixed;

    inset:0;

    background:

    radial-gradient(circle at 20% 20%,rgba(90,60,30,.08),transparent 35%),

    radial-gradient(circle at 80% 70%,rgba(90,60,30,.08),transparent 35%),

    repeating-linear-gradient(
        45deg,
        rgba(255,255,255,.02),
        rgba(255,255,255,.02) 2px,
        transparent 2px,
        transparent 6px
    );

    pointer-events:none;

}

.container{

    display:flex;

    flex-direction:column;

    align-items:center;

    z-index:2;

}

/* Parchment Box */

.message-box{

    background:#f3e2b8;

    color:#4a2b18;

    width:700px;

    max-width:90%;

    padding:40px;

    border:2px solid #8b5a2b;

    border-radius:12px;

    text-align:center;

    box-shadow:
        inset 0 0 30px rgba(0,0,0,.12),
        0 12px 30px rgba(0,0,0,.28);

}

.message-box h2{

    font-family:'UnifrakturCook',cursive;

    font-size:38px;

    color:#5a2f0d;

    margin-bottom:25px;

}

.message-box p{

    font-size:26px;

    line-height:1.8;

}

/* Button */

.list-btn{

    margin-top:35px;

    background:#4b2e16;

    color:#f3e2b8;

    border:none;

    border-radius:8px;

    padding:15px 40px;

    font-family:'Cormorant Garamond',serif;

    font-size:24px;

    cursor:pointer;

    transition:.3s;

    box-shadow:0 8px 18px rgba(0,0,0,.3);

}

.list-btn:hover{

    background:#654321;

    transform:translateY(-3px);

}

</style>
</head>

<body>

<div class="container">

    <div class="message-box">

        <h2>A Royal Proclamation</h2>

        <p>

            The Queen's heart hath already been claimed,
            and neither reason nor remedy may reclaim it.

        </p>

        <p>

            Therefore, by right of devotion,
            this humble admirer dares present a few modest petitions
            unto Her Grace.

        </p>

    </div>

    <button class="list-btn" onclick="goNext()">

        Hear the Petitions

    </button>

</div>

<script>

function goNext(){

    window.location.href="treatment_list.html";

}

</script>

</body>
</html>
