<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Royal Petitions</title>

<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#c8a97e;

    font-family:'Cormorant Garamond',serif;

    overflow:hidden;

}

/* Paper texture */

body::before{

    content:"";

    position:fixed;

    inset:0;

    background:
    radial-gradient(circle at 20% 20%,rgba(90,60,30,.08),transparent 35%),
    radial-gradient(circle at 80% 70%,rgba(90,60,30,.08),transparent 35%),
    repeating-linear-gradient(
        45deg,
        rgba(255,255,255,.02),
        rgba(255,255,255,.02) 2px,
        transparent 2px,
        transparent 6px
    );

    pointer-events:none;

}

/* Main parchment */

.container{

    width:80%;
    max-width:760px;

    background:#f3e2b8;

    border:2px solid #8b5a2b;

    border-radius:12px;

    padding:40px;

    color:#4a2b18;

    box-shadow:
        inset 0 0 30px rgba(0,0,0,.12),
        0 12px 30px rgba(0,0,0,.28);

    z-index:2;

}

h1{

    text-align:center;

    font-family:'UnifrakturCook',cursive;

    font-size:42px;

    margin-bottom:35px;

    color:#5a2f0d;

}

.item{

    display:flex;

    align-items:center;

    margin:22px 0;

    font-size:28px;

}

/* Medieval checkbox */

.checkbox{

    width:34px;

    height:34px;

    border:2px solid #6a3d18;

    border-radius:6px;

    margin-right:18px;

    cursor:pointer;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:24px;

    font-weight:bold;

    transition:.25s;

    background:#ead4a4;

}

.checkbox:hover{

    background:#e0c78d;

}

.checkbox.checked{

    background:#4f7d3c;

    border-color:#4f7d3c;

    color:white;

}

.text{

    flex:1;

}

</style>
</head>

<body>

<div class="container">

<h1>The Royal Petitions</h1>

<div class="item">
<div class="checkbox"></div>
<div class="text">
The Queen's happiness fortune.
</div>
</div>

<div class="item">
<div class="checkbox"></div>
<div class="text">
A generous tribute of kisses shall be bestowed each day.
</div>
</div>

<div class="item">
<div class="checkbox"></div>
<div class="text">
Her devoted admirer must be granted frequent audiences.
</div>
</div>

<div class="item">
<div class="checkbox"></div>
<div class="text">
Her Squishy Honkers.
</div>
</div>

</div>

<script>

const checkboxes=document.querySelectorAll(".checkbox");

let checkedCount=0;

checkboxes.forEach(box=>{

    box.addEventListener("click",()=>{

        if(!box.classList.contains("checked")){

            box.classList.add("checked");

            box.innerHTML="✓";

            checkedCount++;

            if(checkedCount===checkboxes.length){

                setTimeout(()=>{

                    window.location.href="valentine.html";

                },800);

            }

        }

    });

});

</script>

</body>
</html>
