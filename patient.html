<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Audience</title>

<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    height:100vh;

    background:#c8a97e;

    font-family:'Cormorant Garamond',serif;

    overflow:hidden;

}

/* Paper texture */

body::before{

    content:"";

    position:fixed;

    inset:0;

    background:

    radial-gradient(circle at 20% 20%,rgba(90,60,30,.08),transparent 35%),

    radial-gradient(circle at 80% 70%,rgba(90,60,30,.08),transparent 35%),

    repeating-linear-gradient(
    45deg,
    rgba(255,255,255,.02),
    rgba(255,255,255,.02) 2px,
    transparent 2px,
    transparent 6px
    );

    pointer-events:none;

}

/* Message Box */

.box{

    position:relative;
    z-index:2;

    width:420px;
    max-width:90%;

    background:#f3e2b8;

    color:#4a2b18;

    padding:35px;

    border:2px solid #8b5a2b;

    border-radius:12px;

    text-align:center;

    box-shadow:
    inset 0 0 30px rgba(0,0,0,.12),
    0 10px 30px rgba(0,0,0,.25);

}

.box h2{

    font-family:'UnifrakturCook',cursive;

    font-size:42px;

    color:#5a2f0d;

    margin-bottom:20px;

}

.box p{

    font-size:24px;

    line-height:1.6;

}

/* Buttons */

.buttons{

    display:flex;

    gap:20px;

    margin-top:30px;

    z-index:2;

}

.diagnose-btn,
.no-btn{

    text-decoration:none;

    background:#4b2e16;

    color:#f3e2b8;

    padding:14px 34px;

    border-radius:8px;

    border:none;

    cursor:pointer;

    font-size:20px;

    font-family:'Cormorant Garamond',serif;

    transition:.3s;

    box-shadow:0 8px 18px rgba(0,0,0,.3);

}

.diagnose-btn:hover,
.no-btn:hover{

    background:#654321;

    transform:translateY(-3px);

}

/* Make No button slightly darker */

.no-btn{

    background:#2f1b0d;

}

</style>

</head>

<body>

<div class="box">

    <h2>My Queen</h2>

    <p>Pardon this humble soul for approaching Your Grace's door.</p>

    <p>May I be granted leave to speak?</p>

</div>

<div class="buttons">

    <a href="symptoms.html" class="diagnose-btn">
        Grant Leave
    </a>

    <button class="no-btn" onclick="showWarning()">
        Refuse
    </button>

</div>

<script>

function showWarning(){

    alert("⚠️ You're trying to silence your baby?");

}

</script>

</body>
</html>
