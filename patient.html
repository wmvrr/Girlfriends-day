<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Constellation</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:radial-gradient(circle at bottom,#1b2735,#090a0f 80%);
    height:100vh;
    font-family:Arial,Helvetica,sans-serif;
}

canvas{
    position:absolute;
    inset:0;
}

.tooltip{
    position:absolute;
    padding:12px 18px;
    background:rgba(255,255,255,.1);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.2);
    color:white;
    border-radius:15px;
    pointer-events:none;
    transform:translate(-50%,-120%);
    opacity:0;
    transition:.25s;
    box-shadow:0 0 25px rgba(255,255,255,.2);
    font-size:15px;
    min-width:180px;
    text-align:center;
    .next-btn{

    position:absolute;
    bottom:40px;
    right:40px;

    padding:14px 28px;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.25);

    color:white;

    text-decoration:none;

    border-radius:14px;

    backdrop-filter:blur(12px);

    transition:.3s;

    font-size:18px;

    box-shadow:0 0 20px rgba(255,255,255,.15);

}

.next-btn:hover{

    transform:translateY(-4px);

    box-shadow:0 0 35px rgba(255,255,255,.35);
    <a href="nextpage.html" class="next-btn">
    Next Page →
</a>

}
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="tooltip" id="tooltip"></div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

window.addEventListener("resize",()=>{
canvas.width=innerWidth;
canvas.height=innerHeight;
});

const tooltip=document.getElementById("tooltip");

const stars=[
{
x:250,
y:250,
r:5,
text:"✨ The day I met you, my universe changed."
},
{
x:450,
y:170,
r:5,
text:"💖 Your smile outshines every star."
},
{
x:650,
y:280,
r:5,
text:"🌙 You are my favorite miracle."
},
{
x:900,
y:170,
r:5,
text:"❤️ Every road somehow leads back to you."
},
{
x:1100,
y:320,
r:5,
text:"🌌 I'd choose you in every universe."
}
];

let t=0;

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

t+=0.01;

const positions=[];

stars.forEach((star,i)=>{

const x=star.x+Math.sin(t+i)*8;
const y=star.y+Math.cos(t+i*0.7)*8;

positions.push({x,y});

});

ctx.strokeStyle="rgba(255,255,255,.35)";
ctx.lineWidth=1.5;
ctx.beginPath();

positions.forEach((p,i)=>{

if(i===0)
ctx.moveTo(p.x,p.y);
else
ctx.lineTo(p.x,p.y);

});

ctx.stroke();

positions.forEach((p,i)=>{

const pulse=stars[i].r+Math.sin(t*4+i)*1.2;

const glow=ctx.createRadialGradient(
p.x,p.y,0,
p.x,p.y,pulse*8
);

glow.addColorStop(0,"rgba(255,255,255,1)");
glow.addColorStop(.3,"rgba(180,220,255,.9)");
glow.addColorStop(1,"rgba(180,220,255,0)");

ctx.fillStyle=glow;
ctx.beginPath();
ctx.arc(p.x,p.y,pulse*8,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="white";
ctx.beginPath();
ctx.arc(p.x,p.y,pulse,0,Math.PI*2);
ctx.fill();

});

requestAnimationFrame(draw);

}

draw();

canvas.addEventListener("mousemove",(e)=>{

let found=false;

const rect=canvas.getBoundingClientRect();

const mx=e.clientX-rect.left;
const my=e.clientY-rect.top;

stars.forEach((star,i)=>{

const x=star.x+Math.sin(t+i)*8;
const y=star.y+Math.cos(t+i*.7)*8;

const d=Math.hypot(mx-x,my-y);

if(d<18){

tooltip.style.left=x+"px";
tooltip.style.top=y+"px";
tooltip.innerHTML=star.text;
tooltip.style.opacity=1;
found=true;

}

});

if(!found){

tooltip.style.opacity=0;

}

});

</script>

</body>
</html>
