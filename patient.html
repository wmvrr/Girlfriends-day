<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Audience</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .box {
            background-color: pink;
            color: black;
            width: 320px;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            font-size: 20px;
        }

      .buttons{
    display:flex;
    gap:15px;
    margin-top:20px;
}

.diagnose-btn,
.no-btn{

    background-color:brown;
    color:black;

    padding:12px 25px;

    border-radius:8px;

    font-size:18px;

    text-decoration:none;

    border:none;

    cursor:pointer;

    box-shadow:0 3px 6px rgba(0,0,0,.2);

    transition:.25s;
}

.diagnose-btn:hover,
.no-btn:hover{

    opacity:.85;
    transform:translateY(-2px);

}

.no-btn{

    background:#555;
    color:red;

}
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>My Queen!</h2>
        <p>Pardon me for barging at your door.</p>
         <p>May I speak?</p>
       
    
    </div>

<div class="buttons">

    <a href="symptoms.html" class="diagnose-btn">
        Diagnose
    </a>

    <button class="no-btn" onclick="showWarning()">
        NO
    </button>

</div>
<script>

function showWarning(){

    alert("⚠️ You're trying to silence your baby?");

}

</script>
</body>
</html>
