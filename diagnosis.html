<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Royal Inquiry</title>

<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    height:100vh;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:#c8a97e;

    font-family:'Cormorant Garamond',serif;

    overflow:hidden;

}

/* Paper texture */

body::before{

    content:"";

    position:fixed;

    inset:0;

    background:

    radial-gradient(circle at 20% 20%,rgba(90,60,30,.08),transparent 35%),

    radial-gradient(circle at 80% 70%,rgba(90,60,30,.08),transparent 35%),

    repeating-linear-gradient(
        45deg,
        rgba(255,255,255,.02),
        rgba(255,255,255,.02) 2px,
        transparent 2px,
        transparent 6px
    );

    pointer-events:none;

}

/* Question Box */

.question-box{

    position:relative;

    z-index:2;

    width:650px;

    max-width:90%;

    background:#f3e2b8;

    color:#4a2b18;

    padding:35px;

    border:2px solid #8b5a2b;

    border-radius:12px;

    text-align:center;

    font-family:'UnifrakturCook',cursive;

    font-size:36px;

    box-shadow:
        inset 0 0 30px rgba(0,0,0,.12),
        0 10px 30px rgba(0,0,0,.25);

}

/* Options */

.options{

    width:650px;

    max-width:90%;

    margin-top:35px;

    display:flex;

    flex-direction:column;

    gap:15px;

    z-index:2;

}

.option-btn{

    background:#f3e2b8;

    color:#4a2b18;

    border:2px solid #8b5a2b;

    border-radius:10px;

    padding:16px 20px;

    font-size:24px;

    font-family:'Cormorant Garamond',serif;

    cursor:pointer;

    transition:.3s;

    box-shadow:0 6px 14px rgba(0,0,0,.2);

}

.option-btn:hover{

    background:#ead4a4;

    transform:translateY(-2px);

}

/* Correct */

.option-btn.correct{

    background:#4f7d3c;

    color:#fff8e7;

    border-color:#4f7d3c;

}

/* Wrong */

.option-btn.wrong{

    background:#8b2e1f;

    color:#fff8e7;

    border-color:#8b2e1f;

}

</style>
</head>

<body>

<div class="question-box">

    What stirred within Your Grace's heart?

</div>

<div class="options">

    <button class="option-btn" data-answer="wrong">
        A. "Not this peasant again."
    </button>

    <button class="option-btn" data-answer="wrong">
        B. "Ew."
    </button>

    <button class="option-btn" data-answer="correct">
        C. Butterflies took flight within my heart.
    </button>

    <button class="option-btn" data-answer="wrong">
        D. "How dare he approach me!"
    </button>

</div>

<script>

const buttons=document.querySelectorAll(".option-btn");

buttons.forEach(btn=>{

    btn.addEventListener("click",()=>{

        if(btn.dataset.answer==="correct"){

            btn.classList.add("correct");

            setTimeout(()=>{

                window.location.href="treatment_request.html";

            },1000);

        }

        else{

            btn.classList.add("wrong");

            setTimeout(()=>{

                btn.classList.remove("wrong");

            },800);

        }

    });

});

</script>

</body>
</html>
